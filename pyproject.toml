[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superinformation-genomics"
version = "0.1.0"
description = "Deterministic core implementation of the finalized Superinformation analysis specification"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
